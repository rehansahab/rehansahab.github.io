name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A21C98: ${{ secrets.A21C98 }}
          B3B8BC: ${{ secrets.B3B8BC }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A21C98', '')
          sec_b = os.environ.get('B3B8BC', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- 16de6821a7693f1a7ee7af02b3 -->', sec_a)
          if sec_b:
              after = after.replace('<!-- ebb96ae0e92c98192a54783914049702d0 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
